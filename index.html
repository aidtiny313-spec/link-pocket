<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101e25">
<title>링크 포켓</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="stylesheet" href="./style.css">
<script src="./app.js" defer></script>
</head>
<body>
<main>
<header><div class="brand"><img src="./icon.png" alt="" width="44" height="44"><h1>링크 포켓</h1></div><button id="add" class="primary">＋ 링크 추가</button></header>
<input id="search" type="search" aria-label="링크 검색" placeholder="이름 또는 주소 검색">
<p id="notice" role="status" hidden></p>
<div id="links"></div>
</main>
<dialog id="editor">
<form id="form">
<h2 id="editor-title">링크 추가</h2>
<label>이름 <span>(선택)</span><input id="title" maxlength="120" placeholder="예: 자주 쓰는 문서"></label>
<label>웹 주소<input id="address" required type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://example.com"></label>
<label class="check"><input id="favorite" type="checkbox">즐겨찾기</label>
<p id="error" role="alert" hidden></p>
<div class="actions"><button id="cancel" type="button">취소</button><button class="primary" type="submit">저장</button></div>
</form>
</dialog>
<template id="row"><article><a target="_blank" rel="noopener noreferrer"><span class="mark" aria-hidden="true"></span><span class="details"><strong></strong><small></small></span></a><button class="star" type="button"></button><button class="edit" type="button">수정</button></article></template>
</body>
</html>
